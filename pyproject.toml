[project]
name = "ecobici"
version = "0.1.0"
description = "Predict the probability of finding a free dock at an Ecobici CDMX station on arrival"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
]

[project.optional-dependencies]
# Only what the EC2 capture box needs.
collector = ["boto3>=1.35"]
# Ingest, features, training and evaluation.
model = [
    "duckdb>=1.1",
    "lightgbm>=4.5",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
]
# Dev-only station viewer (apps/station_viewer.py).
viz = [
    "pandas>=2.2",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
ecobici-capture = "ecobici.collector.cli:main"
ecobici-capture-report = "ecobici.collector.report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecobici"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
